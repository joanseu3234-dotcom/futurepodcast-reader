name: 自動更新新集數

on:
  schedule:
    - cron: "0 1 * * 6" # 每週六 09:00（台灣時間），官方每週五下午上架
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-episodes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-medium
      - run: pip install anthropic faster-whisper opencc-python-reimplemented
      - name: 轉錄並整理新集數
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::請先在 repo 的 Settings → Secrets and variables → Actions 新增 ANTHROPIC_API_KEY"
            exit 1
          fi
          python scripts/update_episodes.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: 自動新增新集數 $(date +%F)"
          git push
